</style></head><body><main id="game" aria-label="Plant Defense game"><canvas id="world" aria-label="Garden defense game canvas"></canvas><section id="hud" class="hide" aria-live="polite"><div id="left" class="hudbox"><div id="levelText">LEVEL 1</div><div id="score">SCORE: 0000</div><div id="wave">WAVE 1 / 5</div></div><div id="center" class="hudbox">🌱 PLANT HP <div class="bar"><i id="plantBar"></i></div><span id="plantNum">100%</span><div class="tiny" id="water">💧 WATER: 100%</div></div><div id="right" class="hudbox"><div id="lives">LIVES: ❤️ ❤️ ❤️</div></div></section><button id="pause" class="btn blue pause hide">⏸ PAUSE</button><div id="joystick" class="hide" aria-label="Move Arjun"><div id="stick"></div></div><div class="actions hide" id="actions"><button class="action" id="spray">💦 SPRAY</button><button class="action" id="lady">🐞 LADYBUG</button><button class="action" id="barrier">🛡️ BARRIER</button></div><div id="overlays"></div></main><script>
(()=>{'use strict';
const $=s=>document.querySelector(s), game=$('#game'), canvas=$('#world'), ctx=canvas.getContext('2d'), overlays=$('#overlays'); let W,H,dpr, last=0;
const levels=[['Plant Parts','Roots anchor plants and absorb water. Aim your spray at nearby aphids!',5,1],['Photosynthesis','Leaves use sunlight, water, and carbon dioxide to make food. Ladybugs are now ready!',8,2],['Plant Nutrition','Plants need mineral nutrients from soil. Build a natural barrier when needed.',12,3],['Plant Diseases & Pests','Observe closely: pests feed on sap and can spread disease.',16,3],['Ecosystem Rescue','Every garden helper has a role. Use all your tools to save this ecosystem!',20,4]];
const questions=[['Which part absorbs water from soil?',['Leaf','Root','Flower','Fruit'],1,'Roots absorb water and dissolved minerals.'],['What do leaves use to make food?',['Sunlight','Moonlight','Plastic','Noise'],0,'Leaves capture sunlight for photosynthesis.'],['Aphids feed mainly on…',['Plant sap','Rocks','Clouds','Seeds only'],0,'Aphids pierce plants and drink sugary sap.'],['Which insect helps control aphids?',['Ladybug','Mosquito','Termite','Flea'],0,'Ladybugs are helpful garden predators.'],['Plants release which gas in photosynthesis?',['Oxygen','Smoke','Helium','Salt'],0,'Photosynthesis releases oxygen.'],['What gives leaves their green color?',['Chlorophyll','Sand','Sap','Bark'],0,'Chlorophyll captures light energy.'],['Which is a plant nutrient?',['Nitrogen','Plastic','Glass','Ink'],0,'Nitrogen supports healthy leafy growth.'],['Flowers mainly help with…',['Reproduction','Walking','Digestion','Flying'],0,'Flowers help plants reproduce.'],['Pollinators move…',['Pollen','Pebbles','Water bottles','Roots'],0,'Pollen transfer can lead to seeds and fruit.'],['A barrier protects the plant by…',['Slowing pests','Making aphids bigger','Removing sunlight','Changing soil to metal'],0,'Physical barriers make pest access harder.'],['What does a stem do?',['Moves water and support','Makes noise','Eats insects','Creates rocks'],0,'Stems support the plant and transport materials.'],['Why is water important to plants?',['Photosynthesis','Making plastic','Stopping roots','Changing colors only'],0,'Water is a photosynthesis ingredient.'],['Too many aphids can make plants…',['Weak','Metallic','Invisible','Louder'],0,'Sap loss can weaken a plant.'],['Compost can improve…',['Soil nutrients','Cloud height','Toy size','Moonlight'],0,'Compost adds organic matter and nutrients.'],['A food web shows…',['Feeding relationships','Shoe sizes','Weather only','Plant names'],0,'Food webs connect organisms through food.'],['What do roots also help do?',['Anchor plant','Catch sunlight','Fly','Make pollen'],0,'Roots hold the plant securely in soil.'],['Which action is least helpful for aphids?',['Ladybugs nearby','Overcrowded leaves','No predators','Tender new growth'],0,'Ladybugs prey on many aphids.'],['Tomatoes develop from…',['Flowers','Roots','Rocks','Bark'],0,'After pollination, flowers can become fruit.'],['Plants need carbon dioxide from…',['Air','Soil only','Plastic','Shoes'],0,'Leaves take carbon dioxide from the air.'],['What can healthy soil contain?',['Helpful microbes','Only metal','No water','No air'],0,'Soil organisms can support nutrient cycling.'],['Which is a beneficial insect?',['Ladybug','Aphid','Plant louse','Sap sucker'],0,'Ladybugs help reduce pest populations.'],['Water spray works best when…',['Aphids are close','Plant is gone','No game is running','You are paused'],0,'Move Arjun near pests before spraying.'],['Why protect biodiversity?',['It supports resilient ecosystems','It removes all plants','It stops rain','It makes pests stronger'],0,'Many species help keep ecosystems balanced.'],['A wilted plant may need…',['Water','More plastic','Less soil','A loud sound'],0,'Wilting is often a sign of water stress.'],['What is a pest?',['An organism that harms crops','A helpful pollinator','A soil nutrient','A flower part'],0,'Pests can damage plants or spread disease.'],['Plants make sugars during…',['Photosynthesis','Evaporation only','Sleeping','Germination only'],0,'Photosynthesis turns light energy into stored chemical energy.'],['Why are flowers colorful?',['To attract pollinators','To scare roots','To make sap','To grow rocks'],0,'Color and scent can attract pollinators.'],['What should you do after spotting pests?',['Use a suitable plant-safe defense','Ignore them forever','Pull roots out','Stop watering'],0,'Careful protection keeps plants healthier.'],['What moves water upward in plants?',['Xylem','Petals','Pollen','Fruit'],0,'Xylem is water-conducting tissue.'],['What can plants provide in an ecosystem?',['Food and habit const S={screen:'menu',level:0,wave:1,spawned:0,killed:0,score:0,xp:0,correct:0,lives:3,plant:100,water:100,barrier:0,ladyCD:0,enemies:[],ladybugs:[],particles:[],player:{x:0,y:0,dir:0,hit:0,action:0},input:{x:0,y:0,keys:{}},running:false,questionPool:[]};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!S.player.x){S.player.x=W*.5;S.player.y=H*.68}} addEventListener('resize',resize);resize();
function save(){try{localStorage.setItem('plantDefense',JSON.stringify({best:Math.max(S.score,+(localStorage.pdBest||0)),sound:Audio.on}));localStorage.pdBest=Math.max(S.score,+(localStorage.pdBest||0))}catch(e){}}
const Audio={on:true,play(type){if(!this.on)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value={click:360,spray:610,good:730,bad:150,win:880,lose:105}[type]||300;g.gain.value=.05;o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.08)}catch(e){}}};try{let d=JSON.parse(localStorage.getItem('plantDefense'));if(d)Audio.on=d.sound!==false}catch(e){}
function show(html){overlays.innerHTML=`<section class="screen">${html}</section>`;S.screen='overlay';} function close(){overlays.innerHTML='';S.screen='game'} function button(t,id,c=''){return `<button id="${id}" class="btn ${c}">${t}</button>`}
function menu(){S.running=false;$('#hud').classList.add('hide');$('#pause').classList.add('hide');$('#joystick').classList.add('hide');$('#actions').classList.add('hide');show(`<div class="panel"><div class="mascot">🌱</div><h1 class="title">PLANT DEFENSE</h1><p class="sub">Save the Garden!</p><p>Join <b>Arjun</b> to protect a tomato plant from hungry aphids.</p><div class="row">${button('START GAME','start')}${button('HOW TO PLAY','how','blue')}${button(Audio.on?'🔊 SOUND ON':'🔇 SOUND OFF','sound','blue')}</div><p class="tiny">Best score: ${localStorage.pdBest||0}</p><button id="reset" class="setting">Reset progress</button></div>`);$('#start').onclick=objectives;$('#how').onclick=how;$('#sound').onclick=()=>{Audio.on=!Audio.on;save();menu()};$('#reset').onclick=()=>{try{localStorage.clear()}catch(e){};menu()}}
function objectives(){show(`<div class="panel"><h2>LEARNING OBJECTIVES</h2><p>By the end of this game, you will be able to:</p><ul class="list"><li>✓ Identify major plant parts</li><li>✓ Explain basic photosynthesis</li><li>✓ Understand plant nutrients</li><li>✓ Identify helpful and harmful insects</li><li>✓ Explain plant protection</li><li>✓ Understand ecosystems</li></ul>${button('CONTINUE','continue')}</div>`);$('#continue').onclick=characterIntro}
function how(){show(`<div class="panel"><h2>HOW TO PLAY</h2><ul class="list"><li>🕹️ Move Arjun with the joystick (or WASD / arrows).</li><li>💦 Spray nearby aphids. Water refills over time.</li><li>🐞 Call Ladybugs to chase pests once unlocked.</li><li>🛡️ Make a Natural Barrier around the plant.</li><li>❤️ Protect Arjun’s 3 lives and keep the plant alive.</li><li>🧠 Answer science moments between waves.</li><li>🏆 Complete all 5 levels!</li></ul>${button('START GAME','go')}</div>`);$('#go').onclick=characterIntro}
function characterIntro(){show(`<div class="panel"><div class="mascot">🧑🏽‍🌾</div><h2>MEET ARJUN</h2><p class="sub">A curious young garden defender in his blue hoodie and white sneakers.</p><p>Professor Ravi will guide you through the science. First, protect the plant!</p>${button('MEET PROFESSOR RAVI','prof')}</div>`);$('#prof').onclick=()=>intro(0)}
function intro(i){S.level=i;let l=levels[i];show(`<div class="panel"><div class="mascot">👨🏽‍🏫</div><h2>LEVEL ${i+1}: ${l[0].toUpperCase()}</h2><p class="sub">Professor Ravi says:</p><p>“${l[1]}”</p>${button('START LEVEL','begin')}</div>`);$('#begin').onclick=()=>startLevel(i)}
function startLevel(i){S.level=i;S.wave=1;S.spawned=0;S.killed=0;S.enemies=[];S.ladybugs=[];S.particles=[];S.plant=100;S.lives=3;S.water=100;S.barrier=0;S.ladyCD=0;S.player={x:W*.5,y:H*.72,dir:-Math.PI/2,hit:0,action:0};S.questionPool=questions.map((_,n)=>n).sort(()=>Math.random()-.5); close();S.running=true;$('#hud').classList.remove('hide');$('#pause').classList.remove('hide');$('#joystick').classList.remove('hide');$('#actions').classList.remove('hide');updateHUD();}
function updateHUD(){let l=levels[S.level];$('#levelText').textContent=`LEVEL ${S.level+1}: ${l[0]}`;$('#score').textContent=`SCORE: ${String(S.score).padStart(4,'0')}`;$('#wave').textContent=`WAVE ${S.wave} / ${l[3]}`;$('#plantBar').style.width=S.plant+'%';$('#plantNum').textContent=Math.max(0,Math.ceil(S.plant))+'%';$('#lives').textContent='LIVES: '+Array(3).fill(0).map((_,i)=>i<S.lives?'❤️':'🖤').join(' ');$('#water').textContent=`💧 WATER: ${Math.round(S.water)}%`;$('#lady').textContent=S.level<1?'🐞 LOCKED':S.ladyCD>0?`🐞 ${Math.ceil(S.ladyCD)}s`:'🐞 LADYBUG';$('#barrier').textContent=S.level<2?'🛡️ LOCKED':S.barrier>0?`🛡️ ${Math.ceil(S.barrier)}s`:'🛡️ BARRIER';$('#lady').disabled=S.level<1||S.ladyCD>0;$('#barrier').disabled=S.level<2||S.barrier>0}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;game.append(e);setTimeout(()=>e.remove(),1450)}
function spawn(){let side=Math.floor(Math.random()*4),m=50,x=side===0?-m:side===1?W+m:Math.random()*W,y=side===2?-m:side===3?H+m:Math.random()*H;S.enemies.push({x,y,hp:1,speed:24+S.level*6+S.wave*2,attack:0,wob:Math.random()*6.3,hit:0});S.spawned++}
function kill(e, bonus=10){let ix=S.enemies.indexOf(e);if(ix<0)return;S.enemies.splice(ix,1);S.killed++;S.score+=bonus;for(let i=0;i<8;i++)S.particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,t:.55,color:'#c4f27c'});toast(`+${bonus} SCORE`);Audio.play('good');}
function spray(){if(!S.running||S.water<20)return;S.water-=20;S.player.action=.35;Audio.play('spray');for(let i=0;i<18;i++)S.particles.push({x:S.player.x,y:S.player.y,vx:Math.cos(S.player.dir+(Math.random()-.5)*.65)*(100+Math.random()*100),vy:Math.sin(S.player.dir+(Math.random()-.5)*.65)*(100+Math.random()*100),t:.45,color:'#71def5'});S.enemies.slice().forEach(e=>{let dx=e.x-S.player.x,dy=e.y-S.player.y,d=Math.hypot(dx,dy),a=Math.abs(Math.atan2(dy,dx)-S.player.dir);if(d<150&&(a<.9||a>5.4))kill(e)});updateHUD()}
function lady(){if(!S.running||S.level<1||S.ladyCD>0)return;S.ladyCD=12;S.ladybugs.push({x:S.player.x,y:S.player.y,t:6});Audio.play('click');updateHUD()}
function barrier(){if(!S.running||S.level<2||S.barrier>0)return;S.barrier=8;S.player.action=.4;Audio.play('click');toast('BARRIER ACTIVE!');updateHUD()}
function damage(){if(S.player.hit>0)return;S.player.hit=1.2;S.lives--;toast('ARJUN HIT!');Audio.play('bad');if(S.lives<=0)end(false);updateHUD()}
function question(){S.running=false;let q=questions[S.questionPool.shift()??Math.floor(Math.random()*questions.length)];show(`<div class="panel"><div class="mascot">👨🏽‍🏫</div><h2>SCIENCE MOMENT</h2><p class="sub">${q[0]}</p><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-i="${i}">${'ABCD'[i]}. ${a}</button>`).join('')}</div><p id="feedback" class="feedback" aria-live="polite"></p></div>`);document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let good=+b.dataset.i===q[2];document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('#feedback').textContent=(good?'✓ Correct! +20 XP. ':'✕ Not quite. ')+q[3];if(good){S.xp+=20;S.correct++;S.score+=20;Audio.play('good')}else Audio.play('bad');setTimeout(()=>{close();S.running=true;updateHUD()},1500)})}
function waveEnd(){if(S.wave<levels[S.level][3]){toast('WAVE COMPLETE!');S.wave++;S.spawned=0;S.killed=0;setTimeout(question,700)}else levelEnd()}
function levelEnd(){S.running=false;save();show(`<div class="panel"><div class="mascot">${S.level===4?'🎉':'🌿'}</div><h2>${S.level===4?'GARDEN SAVED!':'LEVEL COMPLETE!'}</h2><div class="stats"><span>Score</span><b>${S.score}</b><span>XP</span><b>${S.xp}</b><span>Questions correct</span><b>${S.correct}</b><span>Plant health</span><b>${Math.ceil(S.plant)}%</b><span>Lives remaining</span><b>${S.lives}</b></div><p>${S.level===4?'Professor Ravi and Arjun celebrate your ecosystem rescue!':'Professor Ravi: “Excellent plant protection!”'}</p>${button(S.level===4?'PLAY AGAIN':'NEXT LEVEL','next')}${button('MAIN MENU','main','orange')}</div>`);Audio.play('win');$('#next').onclick=()=>S.level===4?intro(0):intro(S.level+1);$('#main').onclick=menu}
function end(win){if(!S.running)return;S.running=false;save();show(`<div class="panel"><div class="mascot">${win?'🎉':'🥀'}</div><h2>${win?'GARDEN SAVED!':'GAME OVER'}</h2><p>${S.plant<=0?'The tomato plant needs another defender.':'Arjun needs a fresh start.'}</p><div class="row">${button('RESTART LEVEL','restart')}${button('MAIN MENU','main','orange')}</div></div>`);Audio.play('lose');$('#restart').onclick=()=>startLevel(S.level);$('#main').onclick=menu}
function pause(){if(!S.running)return;S.running=false;show(`<div class="panel"><h2>PAUSED</h2><div class="row">${button('RESUME','resume')}${button('RESTART LEVEL','restart','orange')}${button('HOW TO PLAY','how','blue')}${button('EXIT GAME','exit','red')}</div></div>`);$('#resume').onclick=()=>{close();S.running=true};$('#restart').onclick=()=>startLevel(S.level);$('#how').onclick=how;$('#exit').onclick=()=>show(`<div class="panel"><h2>Are you sure you want to exit?</h2><div class="row">${button('YES, EXIT','yes','red')}${button('CANCEL','cancel')}</div></div>`);setTimeout(()=>{let y=$('#yes'),c=$('#cancel');if(y)y.onclick=menu;if(c)c.onclick=()=>pause()},0)}
$('#pause').onclick=pause;$('#spray').onclick=spray;$('#lady').onclick=lady;$('#barrier').onclick=barrier;
function joy(e){let r=$('#joystick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),max=35;if(d>max){x*=max/d;y*=max/d}$('#stick').style.transform=`translate(${x}px,${y}px)`;S.input.x=x/max;S.input.y=y/max}let joyOn=false;$('#joystick').addEventListener('pointerdown',e=>{joyOn=true;$('#joystick').setPointerCapture(e.pointerId);joy(e)});$('#joystick').addEventListener('pointermove',e=>{if(joyOn)joy(e)});['pointerup','pointercancel'].forEach(n=>$('#joystick').addEventListener(n,()=>{joyOn=false;S.input.x=S.input.y=0;$('#stick').style.transform=''}));addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();S.input.keys[e.key.toLowerCase()]=true;if(e.key===' ')spray()});addEventListener('keyup',e=>S.input.keys[e.key.toLowerCase()]=false);
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b9df80');g.addColorStop(1,'#5faa58');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.16;ctx.strokeStyle='#397338';ctx.lineWidth=2;for(let x=-H;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H,H);ctx.stroke()}ctx.globalAlpha=1;let px=W*.5,py=H*.48;ctx.fillStyle='#704327';ctx.beginPath();ctx.ellipse(px,py+35,66,20,0,0,7);ctx.fill();if(S.barrier>0){ctx.strokeStyle='#7bffd1';ctx.lineWidth=7;ctx.globalAlpha=.6+Math.sin(performance.now()/100)*.2;ctx.beginPath();ctx.arc(px,py,91,0,7);ctx.stroke();ctx.globalAlpha=1} // plant
let health=S.plant/100;ctx.save();ctx.translate(px,py);ctx.rotate(Math.sin(performance.now()/500)*.03*(health));ctx.strokeStyle='#176338';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,36);ctx.lineTo(0,-50);ctx.stroke();for(let i=0;i<6;i++){let yy=-5-i*12,side=i%2?1:-1;ctx.fillStyle=health>.4?'#419d38':'#9c9238';ctx.beginPath();ctx.ellipse(side*(25+i%2*7),yy,28,12,side*.5,0,7);ctx.fill()}if(health>.68){ctx.fillStyle='#f5cb38';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(Math.cos(i*1.256)*11,-53+Math.sin(i*1.256)*11,7,13,i*1.256,0,7);ctx.fill()}}ctx.restore();
for(let e of S.enemies){ctx.save();ctx.translate(e.x,e.y);ctx.scale(1,.83);ctx.fillStyle=e.hit>0?'#e4ffac':'#94ca42';ctx.strokeStyle='#184b27';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,17,13,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#d8ec76';ctx.beginPath();ctx.ellipse(-5,4,8,4,0,0,7);ctx.fill();ctx.strokeStyle='#214d28';ctx.lineWidth=2;for(let i=-1;i<2;i++){ctx.beginPath();ctx.moveTo(i*6,8);ctx.lineTo(i*8,16);ctx.stroke()}ctx.restore()}
for(let l of S.ladybugs){ctx.save();ctx.translate(l.x,l.y);ctx.fillStyle='#e94135';ctx.strokeStyle='#402a26';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#34242a';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();ctx.restore()}
for(let p of S.particles){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()}let p=S.player;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.dir+Math.PI/2);if(p.hit>0&&Math.floor(p.hit*12)%2)ctx.globalAlpha=.35;ctx.fillStyle='#173e6a';ctx.strokeStyle='#182c3c';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-18,-14,36,35,10);ctx.fill();ctx.stroke();ctx.fillStyle='#b97042';ctx.beginPath();ctx.arc(0,-27,17,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#181717';ctx.beginPath();ctx.arc(0,-32,18,Math.PI,6.25);ctx.fill();if(p.action>0){ctx.fillStyle='#57d9f4';ctx.fillRect(15,-8,24,8)}ctx.restore();}
function tick(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(S.running){let ix=S.input.x+(S.input.keys.a||S.input.keys.arrowleft?-1:0)+(S.input.keys.d||S.input.keys.arrowright?1:0),iy=S.input.y+(S.input.keys.w||S.input.keys.arrowup?-1:0)+(S.input.keys.s||S.input.keys.arrowdown?1:0),d=Math.hypot(ix,iy);if(d){ix/=d;iy/=d;S.player.x=Math.max(22,Math.min(W-22,S.player.x+ix*170*dt));S.player.y=Math.max(80,Math.min(H-22,S.player.y+iy*170*dt));S.player.dir=Math.atan2(iy,ix)}S.player.hit=Math.max(0,S.player.hit-dt);S.player.action=Math.max(0,S.player.action-dt);S.water=Math.min(100,S.water+8*dt);S.barrier=Math.max(0,S.barrier-dt);S.ladyCD=Math.max(0,S.ladyCD-dt);let total=levels[S.level][2]+(S.wave-1)*2;if(S.spawned<total&&Math.random()<dt*1.25)spawn();let px=W*.5,py=H*.48;for(let e of S.enemies.slice()){let dx=px-e.x,dy=py-e.y,dis=Math.hypot(dx,dy),spd=e.speed*(S.barrier>0&&dis<130?.35:1);e.x+=dx/dis*spd*dt;e.y+=dy/dis*spd*dt;e.hit=Math.max(0,e.hit-dt);if(Math.hypot(e.x-S.player.x,e.y-S.player.y)<28)damage();if(dis<55){e.attack-=dt;if(e.attack<=0){S.plant-=S.barrier>0?.4:2.2;e.attack=.8;if(S.plant<=0)end(false)}}}for(let l of S.ladybugs.slice()){l.t-=dt;let target=S.enemies.sort((a,b)=>Math.hypot(a.x-l.x,a.y-l.y)-Math.hypot(b.x-l.x,b.y-l.y))[0];if(target){let dx=target.x-l.x,dy=target.y-l.y,d=Math.hypot(dx,dy);l.x+=dx/d*150*dt;l.y+=dy/d*150*dt;if(d<19)kill(target,10)}if(l.t<=0)S.ladybugs.splice(S.ladybugs.indexOf(l),1)}for(let p of S.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}S.particles=S.particles.filter(p=>p.t>0);if(S.spawned>=total&&S.enemies.length===0)waveEnd();updateHUD()}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);menu();
})();</script></body></html>
